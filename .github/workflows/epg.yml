name: Actualizar lista y resultados EPG

"on":
workflow_dispatch:
schedule:
- cron: "20 6 * * *"

permissions:
contents: write

concurrency:
group: actualizar-epg
cancel-in-progress: false

jobs:
actualizar:
runs-on: ubuntu-latest
timeout-minutes: 20

steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Preparar Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Proteger copia de seguridad anterior
    shell: bash
    run: |
      mkdir -p output
      if [ -f output/IejmoloV_backup.m3u ]; then
        cp output/IejmoloV_backup.m3u /tmp/IejmoloV_backup.m3u
        echo "BACKUP_EXISTE=si" >> "$GITHUB_ENV"
      else
        echo "BACKUP_EXISTE=no" >> "$GITHUB_ENV"
      fi

  - name: Generar lista e informes
    env:
      M3U_URL: ${{ secrets.M3U_URL }}
      XMLTV_URL: ${{ secrets.XMLTV_URL }}
    run: python m3u_epg_matcher.py --out output

  - name: Verificar archivos generados
    shell: bash
    run: |
      set -e
      test -s output/playlist_epg.m3u
      test -s output/epg.xml
      echo "Lista y guía EPG generadas correctamente."

  - name: Conservar copia de seguridad anterior
    if: env.BACKUP_EXISTE == 'si'
    shell: bash
    run: cp /tmp/IejmoloV_backup.m3u output/IejmoloV_backup.m3u

  - name: Guardar resultados en GitHub
    shell: bash
    run: |
      set -e
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add output/

      if git diff --cached --quiet; then
        echo "No hay cambios nuevos que guardar."
        exit 0
      fi

      git commit -m "Actualizar lista e informes EPG"
      git fetch origin main
      git rebase origin/main
      git push origin HEAD:main

  - name: Publicar resultados como artefactos
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: resultado-epg
      path: output/
      if-no-files-found: warn
      retention-days: 7
