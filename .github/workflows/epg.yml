
name: Actualizar lista y resultados EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-epg
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Proteger la copia de seguridad
        shell: bash
        run: |
          mkdir -p output

          if [ -f output/IejmoloV_backup.m3u ]; then
            cp output/IejmoloV_backup.m3u /tmp/IejmoloV_backup.m3u
            echo "BACKUP_EXISTE=si" >> "$GITHUB_ENV"
          else
            echo "BACKUP_EXISTE=no" >> "$GITHUB_ENV"
          fi

      - name: Generar lista e informes
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
          XMLTV_URL: ${{ secrets.XMLTV_URL }}
        run: python m3u_epg_matcher.py --out output

      - name: Conservar copia de seguridad anterior
        if: env.BACKUP_EXISTE == 'si'
        run: cp /tmp/IejmoloV_backup.m3u output/IejmoloV_backup.m3u

      - name: Guardar resultados en GitHub
        run: |
          git add output/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar lista e informes EPG"
            git push
          fi
