
name: Update M3U EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate playlist
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
          XMLTV_URL: ${{ secrets.XMLTV_URL }}
        run: |
          test -n "$M3U_URL"
          test -n "$XMLTV_URL"

          python m3u_epg_matcher.py \
            --m3u "$M3U_URL" \
            --xmltv "$XMLTV_URL" \
            --out output

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: m3u-epg-output
          path: output/
          retention-days: 7
          
